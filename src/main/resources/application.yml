spring:
  # DB 접속 정보는 저장소에 올리지 않습니다.
  #  - 기본값: 아래 ${...:기본값}
  #  - 내 PC 전용 값: src/main/resources/db-local.yml (gitignore 대상)
  #  - 또는 환경변수 DB_URL / DB_USERNAME / DB_PASSWORD
  config:
    import: optional:classpath:db-local.yml

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ids_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ids_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none   # 테이블은 AI 파이프라인(리눅스)이 만들고 관리 → 백엔드는 절대 변경하지 않음
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
    show-sql: false   # 쿼리 확인이 필요할 때만 true

  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080
  error:
    include-message: always
